title = "Cabo Gitleaks Config"

[allowlist]
description = "False-positive path/pattern allowlist"
paths = [
  '''^tests?/fixtures?/''',
  '''^docs/''',
  '''\.md$'''
]

# Sadece örnek/dev kelimelerini whitelista al (gerçek sırları ASLA ekleme)
regexes = [
  '''(?i)\b(dummy|sample|test)(_|-)?(key|token|secret)\b''',
  '''(?i)\blocalhost(:\d+)?\b'''
]
