name: semgrep
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        env:
          SEMGREP_SEND_METRICS: "off"
        with:
          # Hafif ve CI için uygun kural seti
          config: p/ci
