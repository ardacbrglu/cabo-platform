name: semgrep
on:
  pull_request:

permissions:
  contents: read
  actions: read       # run bilgilerini okuyabilsin
  checks: write       # özet/annotation yazabilsin (opsiyonel ama faydalı)

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep (auto rules, fail on findings)
        env:
          SEMGREP_SEND_METRICS: "off"     # telemetri hatasını da susturur
        run: |
          semgrep --config auto --error --timeout 180
