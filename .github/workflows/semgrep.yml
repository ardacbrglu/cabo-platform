# .github/workflows/semgrep.yml

name: Semgrep Security Scan

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep (community rules)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci
        env:
          SEMGREP_SEND_METRICS: "off"