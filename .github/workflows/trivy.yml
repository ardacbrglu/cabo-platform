# .github/workflows/trivy.yml

name: Trivy Security Scan

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch: {}

# İzinlere artık gerek kalmadı çünkü bir yere yükleme yapmıyoruz.
permissions:
  contents: read

jobs:
  fs-scan:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BU ADIM DEĞİŞTİRİLDİ
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          # Çıktı formatını 'table' yaptık, bu log'da okunabilir bir tablo demek.
          format: 'table'
          # Çıktıyı dosyaya değil, log'a yazmasını sağlıyoruz.
          output: '' 
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          vuln-type: library,os

      # BU İKİ ADIM TAMAMEN SİLİNDİ
      # - name: Upload SARIF to Code Scanning
      # ...
      # - name: Keep artifact
      # ...