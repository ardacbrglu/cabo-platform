name: trivy
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  fs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
      - name: Upload Trivy report as artifact (private repo)
        uses: actions/upload-artifact@v4
        with:
          name: trivy.sarif
          path: trivy.sarif
