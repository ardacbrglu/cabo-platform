name: Lint GitHub Actions

on:
  pull_request:
  push:
    branches: [ main, dev ]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check   # PR üzerinde check olarak gösterir
          level: warning              # istersen 'error' yapıp PR’ı düşürtebilirsin
