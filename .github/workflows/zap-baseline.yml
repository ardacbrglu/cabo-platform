name: zap-baseline
on:
  workflow_dispatch:
  schedule: [ { cron: "0 1 * * *" } ]
permissions:
  contents: read
jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ vars.ZAP_TARGET }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
