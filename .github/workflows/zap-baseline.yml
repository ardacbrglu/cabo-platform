name: zap-baseline

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'  # her gün 01:00 UTC

permissions:
  contents: read
  # issues: write  # Issue açtırmak istersen bunu aç, altta allow_issue_writing: true yap

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ vars.ZAP_TARGET }}
          rules_file_name: '.zap/rules.tsv'   # <--- SADECE bu; -c KULLANMIYORUZ
          allow_issue_writing: false          # issue açmasın; istersen true yap + permissions: issues: write
          artifact_name: zap-baseline-${{ github.run_number }}
          cmd_options: '-a'                   # alpha pasif kuralları da tarasın
