name: zap-baseline

on:
  pull_request:        # PR üzerinde otomatik koştur
  workflow_dispatch:   # Elle çalıştırma
  schedule:
    - cron: "0 1 * * *"  # her gün 01:00 UTC

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ vars.ZAP_TARGET }}   # Settings → Actions → Variables
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
