name: zap-full-scan
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Override target URL"
        required: false
        type: string
  schedule:
    - cron: "0 2 * * 1"   # opsiyonel

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PR’de Semgrep'in uyardığı shell interpolation yerine env kullanıyoruz
      - id: resolve
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.target }}" ]; then
            echo "url=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ vars.ZAP_TARGET }}" ]; then
            echo "url=${{ vars.ZAP_TARGET }}" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Set ZAP_TARGET repo variable or provide target input."
            exit 1
          fi

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ steps.resolve.outputs.url }}
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false

      - name: Upload ZAP full-scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-full-report
          path: |
            report_md.md
            report_html.html
            report_json.json
          retention-days: 7
