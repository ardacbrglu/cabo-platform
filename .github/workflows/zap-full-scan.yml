name: zap-full-scan

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Opsiyonel: Hedef URL (repo var. ZAP_TARGET yerine geçer)'
        required: false
  schedule:
    - cron: "0 2 * * 1"  # Her Pazartesi 02:00 UTC

# Issue açmayacağız; artifact yüklemek için read yeterli
permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Manuel input > repo variable (ZAP_TARGET) sıralamasıyla güvenli çözüm
      - name: Resolve target URL (safe)
        id: resolve
        shell: bash
        env:
          INPUT_TARGET: ${{ github.event.inputs.target }}
          VAR_TARGET: ${{ vars.ZAP_TARGET }}
        run: |
          if [ -n "$INPUT_TARGET" ]; then
            echo "url=$INPUT_TARGET" >> "$GITHUB_OUTPUT"
          elif [ -n "$VAR_TARGET" ]; then
            echo "url=$VAR_TARGET" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Set repo variable ZAP_TARGET or provide 'target' input." >&2
            exit 1
          fi

      - name: ZAP Full Scan (no issue writing)
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          # token vermiyoruz -> Issue açma denemeyecek
          target: ${{ steps.resolve.outputs.url }}
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          cmd_options: >-
            -a
            -J report_json.json
            -w report_md.md
            -r report_html.html

      - name: Upload ZAP full-scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-full-report
          path: |
            report_md.md
            report_html.html
            report_json.json
          retention-days: 7
