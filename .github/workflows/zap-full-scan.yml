# .github/workflows/zap-full-scan.yml

name: OWASP ZAP Full Scan

on:
  # This section is corrected.
  # Triggers on push to main or dev branch
  push:
    branches:
      - main
      - dev
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      target:
        description: 'Optional: Target URL to scan'
        required: false
        
  # Runs on a schedule (Every Monday at 02:00 UTC)
  schedule:
    - cron: "0 2 * * 1"

# Permissions needed for the job
permissions:
  contents: read # Allows checkout

env:
  # Fallback target if no other is provided.
  # IMPORTANT: Make sure this URL is correct for your Railway deployment.
  DEFAULT_TARGET: https://cabo-platform-production.up.railway.app

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Run ZAP Full Scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target URL
        id: resolve
        shell: bash
        run: |
          url="${{ github.event.inputs.target || vars.ZAP_TARGET || env.DEFAULT_TARGET }}"
          echo "Scanning target: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Run ZAP Full Scan using Docker
        # We add 'continue-on-error: true' so the workflow doesn't stop
        # if ZAP finds issues. This ensures the report is always uploaded.
        continue-on-error: true
        run: |
          # Create and set permissions for report files
          mkdir -p zap-reports
          chmod a+w zap-reports

          # Run the ZAP Docker container
          docker run --rm \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            -v "${{ github.workspace }}/zap-reports:/zap/reports/:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
              -t "${{ steps.resolve.outputs.url }}" \
              -a \
              -c .zap/rules.tsv \
              -J /zap/reports/report_json.json \
              -w /zap/reports/report_md.md \
              -r /zap/reports/report_html.html

      - name: Upload ZAP Scan Reports
        # 'if: always()' ensures this step runs even if the previous one fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-reports
          path: zap-reports/
          retention-days: 7