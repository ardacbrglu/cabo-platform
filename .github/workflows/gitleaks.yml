name: gitleaks

on:
  push: {}
  pull_request: {}
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          ver=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (always produce SARIF)
        id: run
        continue-on-error: true
        run: |
          set +e
          gitleaks detect \
            --redact \
            --source . \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code=2
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

          # Dosya oluşmadıysa minimal SARIF üret
          if [ ! -f gitleaks.sarif ]; then
            printf '%s\n' \
              '{' \
              '  "version": "2.1.0",' \
              '  "runs": [{' \
              '    "tool": { "driver": { "name": "gitleaks", "informationUri": "https://github.com/gitleaks/gitleaks" } },' \
              '    "results": []' \
              '  }]' \
              '}' > gitleaks.sarif
          fi
          exit 0

      # Fork/Dependabot PR'larında SARIF upload atlanır (token yazamaz)
      - name: Upload SARIF to Code Scanning
        if: ${{ always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks.sarif
          if-no-files-found: warn

      - name: Fail job if leaks found
        if: ${{ steps.run.outputs.exitcode == '2' }}
        run: |
          echo "Gitleaks found secrets. See SARIF/annotations." >&2
          exit 2
