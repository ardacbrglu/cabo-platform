name: gitleaks
on:
  pull_request:
  push:
  schedule: [ { cron: "0 4 * * *" } ]
permissions:
  contents: read
  pull-requests: read   # <-- önemli
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --redact
