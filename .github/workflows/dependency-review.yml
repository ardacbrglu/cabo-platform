name: Dependency Scan (OSV + npm audit)

on:
  pull_request:
  push:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  osv_npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OSV-Scanner’ı Go ile kur (404 sorunu yok)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Install OSV-Scanner
        run: |
          set -euxo pipefail
          go install github.com/google/osv-scanner/cmd/osv-scanner@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          osv-scanner --version

      - name: Run OSV-Scanner (lockfile)
        # Raporu sadece log’a yaz, PR'ı düşürme. Sertleştirmek istersen continue-on-error’u kaldır.
        continue-on-error: true
        run: |
          if [ -f package-lock.json ]; then
            osv-scanner --lockfile=package-lock.json
          elif [ -f pnpm-lock.yaml ]; then
            osv-scanner --lockfile=pnpm-lock.yaml
          elif [ -f yarn.lock ]; then
            osv-scanner --lockfile=yarn.lock
          else
            echo "No lockfile found; skipping OSV scan."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: npm audit (prod)
        continue-on-error: true
        run: |
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
            npm audit --omit=dev --audit-level=high || true
          else
            echo "No package-lock.json; skipping npm audit."
          fi
