name: npm audit (prod)
on:
  pull_request:
  push:
    branches: [ main, dev ]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci --omit=dev
      # High ve üstünde non-zero çıkabilir; şimdilik uyarı ver, düşürmek istersen '|| true' kaldır.
      - run: npm audit --audit-level=high --omit=dev
