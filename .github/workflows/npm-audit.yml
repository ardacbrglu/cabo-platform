name: npm audit (prod)

on:
  pull_request:
  push:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install (prod deps only) - NON-BLOCKING
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev || true
          npm ls react react-dom --depth=0 || true

      - name: npm audit (prod) - NON-BLOCKING
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high --omit=dev || true
